      graph: 'P10'
      pano_dx: 150
      pano_dy: -70

  # two landfalls 1.2 h and 27 km apart on the Zhejiang coast
  landfall_file: landfall.txt
  landfalls:
    Yuhuan:  {place: Yuhuan, Zhejiang, CN,  off_y: -96, simple_dx: -150, simple_dy: -40, color: [255, 196, 120]}
    Yueqing: {place: Yueqing, Zhejiang, CN, off_y: 56,  simple_dx: -150, simple_dy: 40,  color: [255, 216, 130]}

  # damage.txt: only the mainland figure is an official one; the Philippine
  # figure is shared with Typhoon Kujira and the SW monsoon
  damage:
    - {cn: 中国大陆, en: China,       lon: 121.00, lat: 28.50, dead: 6,  lost: 0, loss: '282.6'}
    - {cn: 菲律宾,   en: Philippines, lon: 121.00, lat: 17.50, dead: 29, lost: 3, loss: '6.6'}
    - {cn: 日本,     en: Japan,       lon: 127.90, lat: 26.50, dead: 0,  lost: 0, loss: '0.35'}
    - {cn: 韩国,     en: Korea,       lon: 127.00, lat: 34.50, dead: 1,  lost: 0, loss: '0'}

damage:
  min_gap: 0.70
  popup_duration: 1.6
  spread: 90

view:
  tracking_span_lon: 22.8
  panorama: auto
  warp: auto

# dapiya BW loop: 1210x1210, 10 min per frame, no gap.
# Kept as-is except for a centre crop, because the product is storm-centred.
cloud:
  file: Dolphin_2026_BW_cloud_loop.mp4
  extract_every: 1                       # 10 min/frame needs every frame
  crop: 700                              # centre crop of the 1210 source
  h0: 73.8333                            # data hour of cloud frame 0 (07-27 01:50Z)
  step_h: 0.1666667                      # 10 minutes
  segment1: [0, 2148]
  segment2: [0, 0]
  resume_h: 0.0
  banner: Summary-N-TC-C5.mp4

banner:
  headline: 'WP122026   TYPHOON DOLPHIN   白海豚'
  loss: CNY 28.3 bn
  deaths: '39'

audio:
  landfall_h: 0
  xt_h: 0
  weaken: false

summary:
  note: 全球损失口径无法合并
  sources: JTWC best track - dapiya.cn BW imagery - 应急管理部
  phase2_label: DISSIPATED
  phase2_value: Inland China - 08-10 18Z to 08-11 06Z
  damage_label: DAMAGE  死亡+失踪 / 经济损失
  damage_lines:
    - 中国大陆 6 - CNY282.6 亿（官方）
    - 菲律宾 32（与鲸鱼共同影响）- CNY6.6 亿
