# ---------------------------------------------------------------------------
# Typhoon DOLPHIN (白海豚) - 2026 - WP122026 / 12W
# 路径：sourcedata 三份文件。灾损：sourcedata\damage.txt（纯文本口径）。
# 云图：dapiya.cn BW 产品，须在片尾标注来源。
# 本台风未变性，直接消散，因此没有温带气旋段。
# ---------------------------------------------------------------------------
paths:
  storm: C:\Users\tangtang\Desktop\work\single\2026Dolphin
  assets: C:\Users\tangtang\Desktop\work\res\SMCY1.3
  sourcedata: sourcedata
  build: build
  output: output
  tag: dolphin

output:
  mp4: 2026_Typhoon_Dolphin_Track_Animation.mp4
  poster: 2026_Typhoon_Dolphin_Poster.png

storm:
  id: WP122026
  name_en: DOLPHIN
  name_cn: 白海豚
  name_cn_long: 台风白海豚
  title: TYPHOON DOLPHIN
  subtitle: 2026 - WESTERN NORTH PACIFIC - WP122026
  source_line: JTWC BEST TRACK - DAPIYA BW IMAGERY
  intro_line: 台风白海豚  -  2026  -  WESTERN NORTH PACIFIC
  intro_footer: JTWC BEST TRACK   |   DAPIYA BW CLOUD   |   SMCY1.3
  credit_line: DATA  JTWC best track - cloud imagery dapiya.cn - 应急管理部

data:
  # 81 fixes / 438 h.  Six-hourly, densified to 3-hourly near Okinawa where the
  # eyewall precessed; those extra fixes carry no intensity (N/A) and are used
  # for the PATH only.  Crosses the dateline.
  series:
    - {file: 2026_Typhoon_Dolphin_Disturbance.txt,    phase: DB}
    - {file: 2026_Typhoon_Dolphin_BestTrack.txt,      phase: TC}
    - {file: 2026_Typhoon_Dolphin_Remnant_Vortex.txt, phase: RV}
  ace_end_h: 414                         # end of the tropical-cyclone stage

  rapid_intensification: true

  # every local maximum of the intensity series - a maximal run of equal values
  # strictly above the value before it and strictly after it (10 of them)
  peaks:
    - h: 114.0
      lon: 169.90
      lat: 13.70
      label: 'PEAK 1   135 kt / 930 hPa'
      color: [255, 214, 130]
      summary: '135 kt / 930 hPa - 07-28 18Z'
      graph: 'P1'
      pano_dx: 140
      pano_dy: -70
    - h: 138.0
      lon: 166.80
      lat: 15.80
      label: 'PEAK 2   160 kt / 905 hPa'
      color: [255, 158, 226]
      summary: '160 kt / 905 hPa - 07-29 18Z'
      graph: 'P2'
      pano_dx: 150
      pano_dy: 96
      strong: '160 kt / 905 hPa'
    - h: 174.0
      lon: 161.00
      lat: 18.60
      label: 'PEAK 3   145 kt / 905 hPa'
      color: [200, 236, 255]
      summary: '145 kt / 905 hPa - 07-31 06Z'
      graph: 'P3'
      pano_dx: 150
      pano_dy: -70
    - h: 204.0
      lon: 156.20
      lat: 21.60
      label: 'PEAK 4   130 kt / 925 hPa'
      color: [255, 196, 120]
      summary: '130 kt / 925 hPa - 08-01 12Z'
      graph: 'P4'
      pano_dx: 150
      pano_dy: 96
    - h: 216.0
      lon: 153.50
      lat: 22.70
      label: 'PEAK 5   125 kt / 920 hPa'
      color: [220, 240, 140]
      summary: '125 kt / 920 hPa - 08-02 00Z'
      graph: 'P5'
      pano_dx: -70
      pano_dy: -96
    - h: 276.0
      lon: 140.60
      lat: 25.20
      label: 'PEAK 6   115 kt / 928 hPa'
      color: [170, 240, 190]
      summary: '115 kt / 928 hPa - 08-04 12Z'
      graph: 'P6'
      pano_dx: 150
