<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VIS_CLEAN 云图调节器</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d121a;color:#e8edf4;font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif}header{padding:23px 30px 17px;border-bottom:1px solid #293240;display:flex;align-items:baseline;gap:20px}h1{font-size:21px;margin:0;font-weight:600;letter-spacing:.02em}header span{color:#9eacbd}main{display:grid;grid-template-columns:minmax(0,1fr) 310px;min-height:calc(100vh - 77px)}article{padding:24px 30px}aside{padding:20px 23px;border-left:1px solid #293240;background:#121923}h2{margin:0 0 12px;font-size:14px;font-weight:600;color:#cdd7e5}section{margin-bottom:24px}.views{display:grid;grid-template-columns:minmax(240px,.78fr) minmax(400px,1.3fr);gap:23px;align-items:start}canvas{max-width:100%;display:block}#source{width:100%;background:#06090e;cursor:crosshair;touch-action:none}#composite{width:100%;background:#06090e}figure{margin:0}figcaption{color:#95a5ba;font-size:12px;padding-top:9px}.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}button,.file{background:#222e3f;border:1px solid #3b4b60;color:#e7edf5;border-radius:5px;padding:8px 12px;cursor:pointer;font:inherit}button:hover,.file:hover{background:#2e4058}button.primary{background:#76c8e0;color:#0b1a23;border-color:#76c8e0;font-weight:600}.file input{display:none}select{width:100%;padding:9px;color:#e8edf4;background:#192331;border:1px solid #3b4b60;border-radius:5px}input[type=range]{width:100%;accent-color:#80d1e4;margin:7px 0 15px}label.control{display:flex;justify-content:space-between;color:#b8c5d6;font-size:12px}output{font-variant-numeric:tabular-nums;color:#f3f6fa}small,.note{color:#93a5ba;font-size:12px}#matte{width:170px;border:1px solid #344153;background:repeating-conic-gradient(#283343 0 25%,#1b2532 0 50%) 0/18px 18px}.lower{display:flex;gap:20px;align-items:center;margin-top:20px}.lower p{max-width:560px;color:#a7b5c7;font-size:13px}.status{color:#7ccce2;font-size:12px;margin-top:8px}.mini{font-size:12px}.divider{border-top:1px solid #2a3545;padding-top:18px}.warn{color:#d8ba7b}#command{display:block;background:#111b27;border:1px solid #293a50;padding:12px;margin-top:15px;white-space:pre-wrap;word-break:break-all;color:#a6bacf;font:12px/1.7 Consolas,monospace}@media(max-width:1120px){.views{grid-template-columns:1fr}.views figure:first-child{max-width:380px}}@media(max-width:750px){main{display:block}aside{border-left:0;border-top:1px solid #293240}header{display:block}article{padding:18px}.views{grid-template-columns:1fr}}
</style>
<header><h1>VIS_CLEAN <span style="color:#81cde2">云图调节器</span></h1><span>裁切 · 海蓝底抑制 · 柔和融合</span></header>
<main><article>
<section><h2>观察帧</h2><select id="frames"></select><div class="bar"><label class="file">加载更多原图<input id="loadFrames" type="file" accept="image/png,image/jpeg" multiple></label><label class="file">更换路径背景<input id="loadBackground" type="file" accept="image/*"></label><span class="note" id="frameInfo"></span></div></section>
<div class="views"><figure><h2>原图与取景</h2><canvas id="source" width="768" height="768"></canvas><figcaption>在原图上拖动取景中心。虚线为裁切范围，圆圈为羽化外缘。</figcaption></figure><figure><h2>实际路径画面叠加</h2><canvas id="composite" width="1920" height="1080"></canvas><div class="bar mini"><label><input type="checkbox" id="overlay" checked> 显示云图</label><label><input type="checkbox" id="guide"> 显示位置参考圈</label></div><figcaption>使用与路径脚本一致的滤色合成；裁切边缘为精确零，不加方框。</figcaption></figure></div>
<div class="lower"><canvas id="matte" width="512" height="512"></canvas><div><h2>透明云层</h2><p>海面颜色会被剥离，保留云的明暗纹理；棋盘格表示透明。白色外框仅从与原图外缘连通的区域去除，不抠掉孤立的亮云。</p><p class="warn">日夜都要检查。不要用过高的黑场阈值换取去底，以免丢失薄云。</p><div class="status" id="status"></div></div></div>
<div class="divider" style="margin-top:23px"><div class="bar"><button class="primary" id="saveSettings">导出参数 JSON</button><button id="savePng">导出透明 PNG</button><button id="saveScreen">导出滤色底片 PNG</button><label class="file">导入参数<input id="loadSettings" type="file" accept="application/json,.json"></label><button id="reset">重置</button></div><p class="note">透明 PNG 用常规透明叠加；黑底滤色底片用 Screen / 滤色叠加。批量视频使用同一份参数，保持固定亮度曲线，避免昼夜切换闪烁。</p><code id="command"></code></div>
</article><aside><section><h2>取景</h2><div id="cropControls"></div></section><section class="divider"><h2>云层与底色</h2><div id="toneControls"></div></section><section class="divider"><h2>边缘融合</h2><div id="edgeControls"></div></section><small>参数只影响云图。这个页面离线运行，不上传原图，不覆盖源文件。</small><p class="note">云图来源：dapiya.cn · VIS_clean</p></aside></main>
<script>
'use strict';
const DATA=/*__PAYLOAD__*/;
const INITIAL=structuredClone(DATA.settings);let cfg=structuredClone(INITIAL),samples=DATA.samples.map(x=>({...x})),current=null,background=null,prepared=null,pending=false;
const $=id=>document.getElementById(id),N=512;
const controlSpec=[['center_x','中心 X',0,1,.001,'cropControls'],['center_y','中心 Y',0,1,.001,'cropControls'],['zoom','取景放大',1,5,.01,'cropControls'],['rotation','旋转角度',-30,30,.1,'cropControls'],['black_level','黑场阈值',0,.5,.001,'toneControls'],['white_level','白场位置',.5,1,.001,'toneControls'],['gamma','中间调 Gamma',.25,3,.01,'toneControls'],['gain','云层亮度',.1,3,.01,'toneControls'],['blue_removal','海蓝底抑制',0,3,.01,'toneControls'],['feather','羽化宽度',.05,.8,.005,'edgeControls'],['radius','融合半径',.4,1,.005,'edgeControls'],['opacity','整体强度',0,1,.01,'edgeControls'],['border_softness','原图边界柔化',.005,.15,.001,'edgeControls']];
for(const [key,label,min,max,step,container] of controlSpec){const box=document.createElement('div');box.innerHTML=`<label class="control" for="${key}">${label}<output id="v_${key}"></output></label><input id="${key}" type="range" min="${min}" max="${max}" step="${step}">`;$(container).append(box);$(key).oninput=()=>{cfg[key]=Number($(key).value);schedule()}}
function sync(){for(const [key] of controlSpec){$(key).value=cfg[key];$('v_'+key).textContent=Number(cfg[key]).toFixed(key==='rotation'?1:3)}}
function canvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function loadImage(url){return new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=()=>reject(new Error('无法读取图像'));i.src=url})}
function validSource(im){const scale=Math.min(1,768/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*scale)),h=Math.max(1,Math.round(im.height*scale));const c=canvas(w,h),ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(im,0,0,w,h);const p=ctx.getImageData(0,0,w,h),white=new Uint8Array(w*h),removed=new Uint8Array(w*h),q=new Int32Array(w*h);let tail=0,head=0;
for(let i=0;i<white.length;i++){let j=i*4,r=p.data[j],g=p.data[j+1],b=p.data[j+2];white[i]=Math.min(r,g,b)>=248&&Math.max(r,g,b)-Math.min(r,g,b)<=4?1:0}
const add=i=>{if(white[i]&&!removed[i]){removed[i]=1;q[tail++]=i}};for(let x=0;x<w;x++){add(x);add((h-1)*w+x)}for(let y=0;y<h;y++){add(y*w);add(y*w+w-1)}while(head<tail){const i=q[head++],x=i%w,y=Math.floor(i/w);for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const nx=x+dx,ny=y+dy;if(nx>=0&&nx<w&&ny>=0&&ny<h)add(ny*w+nx)}}
for(let i=0;i<w*h;i++){let j=i*4,v=removed[i]?0:p.data[j+3];p.data[j]=p.data[j+1]=p.data[j+2]=v;p.data[j+3]=255}ctx.putImageData(p,0,0);return c}
function crop(im,isMask=false){const c=canvas(N,N),ctx=c.getContext('2d',{willReadFrequently:true});ctx.fillStyle='#000';ctx.fillRect(0,0,N,N);const w=current.width,h=current.height,span=Math.min(w,h)/cfg.zoom;ctx.translate(N/2,N/2);ctx.rotate(-cfg.rotation*Math.PI/180);ctx.scale(N/span,N/span);ctx.translate(-cfg.center_x*w,-cfg.center_y*h);ctx.drawImage(im,0,0,w,h);ctx.setTransform(1,0,0,1,0,0);return {c,ctx,p:ctx.getImageData(0,0,N,N)}}
const smooth=x=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)};
function processed(){const rgb=crop(current),valid=crop(prepared,true),dist=new Float32Array(N*N);for(let i=0;i<dist.length;i++)dist[i]=valid.p.data[i*4]>250?N:0;
for(let y=0;y<N;y++)for(let x=0;x<N;x++){let i=y*N+x;if(!dist[i])continue;let v=x===0||y===0?1:N;if(x)v=Math.min(v,dist[i-1]+1);if(y)v=Math.min(v,dist[i-N]+1);if(x&&y)v=Math.min(v,dist[i-N-1]+1);if(x<N-1&&y)v=Math.min(v,dist[i-N+1]+1);dist[i]=v}
for(let y=N-1;y>=0;y--)for(let x=N-1;x>=0;x--){let i=y*N+x;if(!dist[i])continue;let v=x===N-1||y===N-1?1:dist[i];if(x<N-1)v=Math.min(v,dist[i+1]+1);if(y<N-1)v=Math.min(v,dist[i+N]+1);if(x<N-1&&y<N-1)v=Math.min(v,dist[i+N+1]+1);if(x&&y<N-1)v=Math.min(v,dist[i+N-1]+1);dist[i]=v}
const rgba=canvas(N,N),rc=rgba.getContext('2d'),rp=rc.createImageData(N,N),screen=canvas(N,N),sc=screen.getContext('2d'),sp=sc.createImageData(N,N);let blue=0,alphaSum=0;const tint=cfg.tint.map(v=>Math.round(v*255));
for(let y=0;y<N;y++)for(let x=0;x<N;x++){const i=y*N+x,j=i*4,r=rgb.p.data[j]/255,g=rgb.p.data[j+1]/255,b=rgb.p.data[j+2]/255;if(b-r>.04)blue++;const neutral=Math.min(r,g,b)-cfg.blue_removal*Math.max(0,b-r),v=Math.max(0,Math.min(1,(neutral-cfg.black_level)/(cfg.white_level-cfg.black_level)));let signal=Math.min(1,Math.pow(v,cfg.gamma)*cfg.gain);const radius=Math.hypot((x+.5-N/2)/(N/2),(y+.5-N/2)/(N/2));let a=signal*smooth((cfg.radius-radius)/cfg.feather)*smooth(dist[i]/(N*cfg.border_softness))*cfg.opacity;if(x===0||y===0||x===N-1||y===N-1)a=0;const byte=Math.round(Math.max(0,Math.min(1,a))*255);alphaSum+=byte;for(let k=0;k<3;k++){rp.data[j+k]=tint[k];sp.data[j+k]=Math.round(tint[k]*byte/255)}rp.data[j+3]=byte;sp.data[j+3]=255}rc.putImageData(rp,0,0);sc.putImageData(sp,0,0);return {rgba,screen,blue:blue/(N*N),mean:alphaSum/(N*N*255)}}
function sourceView(){const s=768,w=current.width,h=current.height,sh=Math.max(1,Math.round(s*h/w));$('source').height=sh;const ctx=$('source').getContext('2d');ctx.fillStyle='#080d13';ctx.fillRect(0,0,s,sh);ctx.drawImage(current,0,0,s,sh);const span=Math.min(w,h)/cfg.zoom,cx=cfg.center_x*s,cy=cfg.center_y*sh,wx=span/w*s,hy=span/h*sh;ctx.save();ctx.translate(cx,cy);ctx.rotate(cfg.rotation*Math.PI/180);ctx.lineWidth=2;ctx.strokeStyle='#8de9ff';ctx.setLineDash([8,6]);ctx.strokeRect(-wx/2,-hy/2,wx,hy);ctx.setLineDash([]);ctx.beginPath();ctx.ellipse(0,0,wx/2*cfg.radius,hy/2*cfg.radius,0,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(-11,0);ctx.lineTo(11,0);ctx.moveTo(0,-11);ctx.lineTo(0,11);ctx.stroke();ctx.restore()}
function render(){pending=false;if(!current||!background)return;sync();sourceView();if(cfg.white_level<=cfg.black_level){$('status').textContent='白场位置必须大于黑场阈值';return}const p=processed();$('matte').getContext('2d').clearRect(0,0,N,N);$('matte').getContext('2d').drawImage(p.rgba,0,0);const c=$('composite'),ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);ctx.drawImage(background,0,0,c.width,c.height);if($('overlay').checked){ctx.globalCompositeOperation='screen';ctx.drawImage(p.screen,1430,410,420,420);ctx.globalCompositeOperation='source-over'}if($('guide').checked){ctx.strokeStyle='#78c8dd';ctx.setLineDash([5,6]);ctx.lineWidth=2;ctx.beginPath();ctx.arc(1640,620,210*cfg.radius,0,Math.PI*2);ctx.stroke();ctx.setLineDash([])}$('status').textContent=`${p.blue>.02?'海蓝背景样本':'黑底 / 中性背景样本'} · 有效透明度均值 ${(p.mean*100).toFixed(1)}% · 边界 alpha = 0`;window.currentResult=p}
function schedule(){if(!pending){pending=true;requestAnimationFrame(render)}}
let selectionToken=0;function list(){const select=$('frames');select.innerHTML='';samples.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=s.name;select.append(o)});select.onchange=async()=>{const token=++selectionToken,sample=samples[Number(select.value)],image=await loadImage(sample.url);if(token!==selectionToken)return;current=image;prepared=validSource(current);$('frameInfo').textContent=sample.utc||sample.name;schedule()};return select.onchange()}
let dragging=false;function pick(e){const r=$('source').getBoundingClientRect();cfg.center_x=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));cfg.center_y=Math.max(0,Math.min(1,(e.clientY-r.top)/r.height));schedule()}
$('source').onpointerdown=e=>{dragging=true;$('source').setPointerCapture(e.pointerId);pick(e)};$('source').onpointermove=e=>{if(dragging)pick(e)};$('source').onpointerup=()=>dragging=false;$('source').onpointercancel=()=>dragging=false;
function download(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
$('saveSettings').onclick=()=>download('vis_clean.json',new Blob([JSON.stringify(cfg,null,2)],{type:'application/json'}));$('savePng').onclick=()=>window.currentResult?.rgba.toBlob(b=>download('cloud_rgba.png',b));$('saveScreen').onclick=()=>window.currentResult?.screen.toBlob(b=>download('cloud_screen.png',b));$('reset').onclick=()=>{cfg=structuredClone(INITIAL);schedule()};$('overlay').onchange=$('guide').onchange=schedule;
$('loadSettings').onchange=async e=>{try{const input=JSON.parse(await e.target.files[0].text());if(!input||Array.isArray(input)||typeof input!=='object')throw new Error('参数必须是 JSON 对象');if(Object.keys(input).some(k=>!(k in INITIAL)))throw new Error('包含未知参数');const v={...INITIAL,...input};if(v.schema!==1)throw new Error('参数版本不支持');for(const [key,,min,max] of controlSpec){v[key]=Number(v[key]);if(!Number.isFinite(v[key])||v[key]<min||v[key]>max)throw new Error('无效参数：'+key)}if(v.white_level<=v.black_level)throw new Error('白场位置必须大于黑场阈值');if(!Array.isArray(v.tint)||v.tint.length!==3)throw new Error('无效色调');v.tint=v.tint.map(Number);if(v.tint.some(x=>!Number.isFinite(x)||x<0||x>1))throw new Error('无效色调');cfg=structuredClone(v);schedule()}catch(err){alert(err.message)}};
$('loadFrames').onchange=async e=>{samples=[...e.target.files].sort((a,b)=>a.name.localeCompare(b.name)).map(f=>({name:f.name,url:URL.createObjectURL(f)}));await list()};$('loadBackground').onchange=async e=>{background=await loadImage(URL.createObjectURL(e.target.files[0]));schedule()};
$('command').textContent=`typhoon.exe vis-clean export "${DATA.project}" --config "${DATA.project}\\build\\vis_clean.json" --source "${DATA.source}" --size 512 --fps 30 --step-seconds 150\n\n先将导出的参数保存为上面的 build\\vis_clean.json。原图快照：${DATA.frame_count} 帧。导出前请确认下载完成；缺测时段保持上一张真实观测，不合成假云图。`;
window.visClean={settings:()=>structuredClone(cfg),render:()=>processed(),set:v=>{cfg={...cfg,...v};schedule()},select:async i=>{$('frames').value=i;await $('frames').onchange()}};
(async()=>{background=await loadImage(DATA.background);await list()})().catch(err=>{$('status').textContent=err.message});
</script></html>
